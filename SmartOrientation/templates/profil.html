<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon profil</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: rgb(190, 190, 206);
        }

        h1 {
            color: #333;
        }

        form {
            max-width: 400px;
            margin-top: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="number"],
        input[type="password"],
        input[type="email"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }
        .container {
            max-width: 530px;
            margin: 0 auto;
            background-color: rgb(35, 208, 148);
            border-radius: 8px;
        }
        .moi {
            padding: 30px;
        }

    </style>
</head>
<body>
    <main class="container">
        <div class="moi">
            
             <h1>Mon profil d'orientation</h1>
             <p>Bienvenue sur votre profil !</p>

            <form action="#" method="POST">
                 <label for="nom">Nom :</label>
                 <input type="text" id="nom" name="nom" placeholder="Entrez votre nom" required><br>

                 <label for="prenom">Prénom :</label>
                 <input type="text" id="prenom" name="prenom" placeholder="Entrez votre prénom" required><br>

                 <label for="age">Âge :</label>
                 <input type="number" id="age" name="age" placeholder="Entrez votre âge" required><br>

                 <label for="email">Email :</label>
                 <input type="email" id="email" name="email" placeholder="Entrez votre email" required><br>


                 <label for="password">Mot de passe :</label>
                 <input type="password" id="password" name="password" placeholder="........" required><br>

                 <label for="confirm_password">Confirmer le mot de passe :</label>
                 <input type="password" id="confirm_password" name="confirm_password" placeholder="........" required><br>

        
                 <button type="submit">Enregistrer</button>

        </div>
    
    </main>
    
    </form>
</body>
</html>
